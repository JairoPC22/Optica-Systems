services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: optica-systems-frontend
    restart: unless-stopped
    security_opt:
      # Evita conflictos de etiquetas SELinux durante las pruebas locales.
      - label=disable
    ports:
      - "80:80"
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
